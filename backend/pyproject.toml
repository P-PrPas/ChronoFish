[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronofish"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.136.0",
  "pydantic==2.13.2",
  "SQLAlchemy==2.0.49",
  "uvicorn==0.44.0",
  "psycopg[binary]>=3.2,<4",
  "PyMySQL>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.3",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

