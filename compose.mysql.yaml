services:
  mysql:
    image: mysql:8.0
    profiles: [mysql]
    environment:
      MYSQL_DATABASE: chronofish
      MYSQL_USER: chronofish
      MYSQL_PASSWORD: chronofish
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
  api-mysql:
    profiles: [mysql]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DB_DRIVER: mysql
      DATABASE_URL: chronofish:chronofish@tcp(mysql:3306)/chronofish?parseTime=true&multiStatements=true
      MIGRATIONS_DIR: /migrations/mysql
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "/chronofish", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
