name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Race-test backend (Linux)
        working-directory: backend
        run: go test -race ./...
      - name: Enforce business-rule coverage
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          go test -coverprofile=/tmp/domain.cover ./internal/domain >/tmp/domain-cover.log
          go test -coverprofile=/tmp/service.cover ./internal/service >/tmp/service-cover.log
          domain=$(go tool cover -func=/tmp/domain.cover | awk '/total:/ {gsub("%", "", $3); print $3}')
          service=$(go tool cover -func=/tmp/service.cover | awk '/total:/ {gsub("%", "", $3); print $3}')
          echo "domain coverage: ${domain}%"
          echo "service coverage: ${service}%"
          test "${domain%.*}" -ge 90
          test "${service%.*}" -ge 90
      - name: Check source encoding
        run: python scripts/check_source_encoding.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci
      - name: Verify generated frontend contract
        working-directory: frontend
        run: npm run generate:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run check
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Validate Compose files
        run: |
          docker compose -f compose.yaml config
          docker compose -f compose.mysql.yaml --profile mysql config
      - name: Build production API image
        run: docker build -f backend/Dockerfile -t chronofish:ci .

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_openapi.py
      - name: Verify generated MySQL migrations
        run: |
          python scripts/gen_mysql_migrations.py
          git diff --exit-code -- backend/db/migrations/mysql

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chronofish
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chronofish"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/chronofish
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go for PostgreSQL
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Verify PostgreSQL v3 to v4 migration upgrade
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chronofish
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE chronofish_upgrade'
          upgrade_url=postgres://postgres:postgres@localhost:5432/chronofish_upgrade
          for migration in backend/db/migrations/postgres/000001_init_schema.up.sql backend/db/migrations/postgres/000002_seed_protocol_stages.up.sql backend/db/migrations/postgres/000003_request_idempotency.up.sql; do
            psql "$upgrade_url" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$upgrade_url" -v ON_ERROR_STOP=1 -c "INSERT INTO operator (id,name,active,created_at,updated_at) VALUES ('00000000-0000-7000-8000-000000000001','upgrade',TRUE,NOW(),NOW())"
          psql "$upgrade_url" -v ON_ERROR_STOP=1 -c "INSERT INTO request_idempotency (scope,idempotency_key,request_hash,status_code,content_type,response_body,operator_id,device_id,created_at,completed_at) VALUES ('upgrade','01900000-0000-7000-8000-000000000301',repeat('a',64),102,'application/json','', '00000000-0000-7000-8000-000000000001','ci',NOW(),NULL)"
          psql "$upgrade_url" -v ON_ERROR_STOP=1 -f backend/db/migrations/postgres/000004_idempotency_lease.up.sql
          psql "$upgrade_url" -v ON_ERROR_STOP=1 -c "SELECT lease_until,lease_token FROM request_idempotency WHERE scope='upgrade' AND idempotency_key='01900000-0000-7000-8000-000000000301'"
      - name: Boot API and apply PostgreSQL migrations
        working-directory: backend
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chronofish?sslmode=disable
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/db/migrations/postgres
          APP_ENV: production
        run: |
          go build -o /tmp/chronofish-postgres-api ./cmd/api
          /tmp/chronofish-postgres-api >/tmp/chronofish-postgres.log 2>&1 &
          api_pid=$!
          echo "$api_pid" >/tmp/chronofish-postgres.pid
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8080/api/v1/health && exit 0 || sleep 2; done
          boot_log_b64=$(tail -c 12000 /tmp/chronofish-postgres.log | base64 -w0)
          echo "::error title=PostgreSQL boot log (base64)::$boot_log_b64"
          cat /tmp/chronofish-postgres.log
          exit 1
      - name: Smoke PostgreSQL durable idempotency
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chronofish?sslmode=disable
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/db/migrations/postgres
          APP_ENV: production
        run: |
          set -euo pipefail
          operator=00000000-0000-7000-8000-000000000001
          key=01900000-0000-7000-8000-000000000201
          headers=(-H "X-Operator-Id: $operator" -H "X-Device-Id: ci-postgres" -H "X-Idempotency-Key: $key" -H 'Content-Type: application/json')
          status=$(curl --silent --show-error -o /tmp/postgres-create.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/api/v1/sites" "${headers[@]}" --data '{"code":"ci-postgres-site","name":"CI PostgreSQL"}')
          test "$status" = 201
          retry=$(curl --silent --show-error -o /tmp/postgres-retry.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/api/v1/sites" "${headers[@]}" --data '{"code":"ci-postgres-site","name":"CI PostgreSQL"}')
          test "$retry" = 201
          conflict=$(curl --silent --show-error -o /tmp/postgres-conflict.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/api/v1/sites" "${headers[@]}" --data '{"code":"ci-postgres-site-other","name":"Conflict"}')
          test "$conflict" = 409
          cmp -s /tmp/postgres-create.json /tmp/postgres-retry.json
      - name: Run repository and API integration suite on PostgreSQL
        working-directory: backend
        env:
          CHRONOFISH_TEST_DATABASE_DRIVER: pgx
          CHRONOFISH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/chronofish?sslmode=disable
        run: go test ./...
      - name: Restart PostgreSQL API and verify durable row and audit
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chronofish?sslmode=disable
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/db/migrations/postgres
          APP_ENV: production
        run: |
          set -euo pipefail
          kill "$(cat /tmp/chronofish-postgres.pid)"
          for i in {1..15}; do ! curl --silent http://127.0.0.1:8080/api/v1/health >/dev/null && break || sleep 1; done
          /tmp/chronofish-postgres-api >/tmp/chronofish-postgres-restart.log 2>&1 &
          echo "$!" >/tmp/chronofish-postgres.pid
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8080/api/v1/health && break || sleep 2; done
          curl --fail --silent http://127.0.0.1:8080/api/v1/sites >/tmp/postgres-sites.json
          curl --fail --silent http://127.0.0.1:8080/api/v1/audit-log >/tmp/postgres-audit.json
          python - <<'PY'
          import json
          sites = json.load(open('/tmp/postgres-sites.json'))['items']
          assert sum(item.get('code') == 'ci-postgres-site' for item in sites) == 1
          audits = json.load(open('/tmp/postgres-audit.json'))['items']
          assert any(item.get('recordId') and item.get('action') == 'INSERT' for item in audits)
          PY
      - name: Test PostgreSQL constraints
        run: psql "$DATABASE_URL" -f backend/db/tests/postgres/constraint_checks.sql
      - name: Verify PostgreSQL master seed is idempotent
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/seeds/postgres/master_data.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/seeds/postgres/master_data.sql

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: chronofish
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go for MySQL
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Verify MySQL v3 to v4 migration upgrade
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE chronofish_upgrade'
          for migration in backend/db/migrations/mysql/000001_init_schema.up.sql backend/db/migrations/mysql/000002_seed_protocol_stages.up.sql backend/db/migrations/mysql/000003_request_idempotency.up.sql; do
            mysql -h 127.0.0.1 -uroot -proot chronofish_upgrade < "$migration"
          done
          mysql -h 127.0.0.1 -uroot -proot chronofish_upgrade -e "INSERT INTO operator (id,name,active,created_at,updated_at) VALUES ('00000000-0000-7000-8000-000000000001','upgrade',TRUE,NOW(),NOW())"
          mysql -h 127.0.0.1 -uroot -proot chronofish_upgrade -e "INSERT INTO request_idempotency (scope,idempotency_key,request_hash,status_code,content_type,response_body,operator_id,device_id,created_at,completed_at) VALUES ('upgrade','01900000-0000-7000-8000-000000000302',REPEAT('a',64),102,'application/json','', '00000000-0000-7000-8000-000000000001','ci',NOW(),NULL)"
          mysql -h 127.0.0.1 -uroot -proot chronofish_upgrade < backend/db/migrations/mysql/000004_idempotency_lease.up.sql
          mysql -h 127.0.0.1 -uroot -proot chronofish_upgrade -e "SELECT lease_until,lease_token FROM request_idempotency WHERE scope='upgrade' AND idempotency_key='01900000-0000-7000-8000-000000000302'"
      - name: Boot API and apply MySQL migrations
        working-directory: backend
        env:
          DB_DRIVER: mysql
          DATABASE_URL: 'root:root@tcp(127.0.0.1:3306)/chronofish?parseTime=true&multiStatements=true'
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/db/migrations/mysql
          APP_ENV: production
        run: |
          go build -o /tmp/chronofish-mysql-api ./cmd/api
          /tmp/chronofish-mysql-api >/tmp/chronofish-mysql.log 2>&1 &
          api_pid=$!
          echo "$api_pid" >/tmp/chronofish-mysql.pid
          for i in {1..45}; do curl --fail --silent http://127.0.0.1:8080/api/v1/health && exit 0 || sleep 2; done
          boot_log_b64=$(tail -c 12000 /tmp/chronofish-mysql.log | base64 -w0)
          echo "::error title=MySQL boot log (base64)::$boot_log_b64"
          cat /tmp/chronofish-mysql.log
          exit 1
      - name: Smoke MySQL durable idempotency
        env:
          DB_DRIVER: mysql
          DATABASE_URL: 'root:root@tcp(127.0.0.1:3306)/chronofish?parseTime=true&multiStatements=true'
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/db/migrations/mysql
          APP_ENV: production
        run: |
          set -euo pipefail
          operator=00000000-0000-7000-8000-000000000001
          key=01900000-0000-7000-8000-000000000202
          headers=(-H "X-Operator-Id: $operator" -H "X-Device-Id: ci-mysql" -H "X-Idempotency-Key: $key" -H 'Content-Type: application/json')
          status=$(curl --silent --show-error -o /tmp/mysql-create.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/api/v1/sites" "${headers[@]}" --data '{"code":"ci-mysql-site","name":"CI MySQL"}')
          test "$status" = 201
          retry=$(curl --silent --show-error -o /tmp/mysql-retry.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/api/v1/sites" "${headers[@]}" --data '{"code":"ci-mysql-site","name":"CI MySQL"}')
          test "$retry" = 201
          conflict=$(curl --silent --show-error -o /tmp/mysql-conflict.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/api/v1/sites" "${headers[@]}" --data '{"code":"ci-mysql-site-other","name":"Conflict"}')
          test "$conflict" = 409
          cmp -s /tmp/mysql-create.json /tmp/mysql-retry.json
      - name: Run repository and API integration suite on MySQL
        working-directory: backend
        env:
          CHRONOFISH_TEST_DATABASE_DRIVER: mysql
          CHRONOFISH_TEST_DATABASE_URL: root:root@tcp(127.0.0.1:3306)/chronofish?parseTime=true&multiStatements=true
        run: go test ./...
      - name: Restart MySQL API and verify durable row and audit
        env:
          DB_DRIVER: mysql
          DATABASE_URL: 'root:root@tcp(127.0.0.1:3306)/chronofish?parseTime=true&multiStatements=true'
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/db/migrations/mysql
          APP_ENV: production
        run: |
          set -euo pipefail
          kill "$(cat /tmp/chronofish-mysql.pid)"
          for i in {1..15}; do ! curl --silent http://127.0.0.1:8080/api/v1/health >/dev/null && break || sleep 1; done
          /tmp/chronofish-mysql-api >/tmp/chronofish-mysql-restart.log 2>&1 &
          echo "$!" >/tmp/chronofish-mysql.pid
          for i in {1..45}; do curl --fail --silent http://127.0.0.1:8080/api/v1/health && break || sleep 2; done
          curl --fail --silent http://127.0.0.1:8080/api/v1/sites >/tmp/mysql-sites.json
          curl --fail --silent http://127.0.0.1:8080/api/v1/audit-log >/tmp/mysql-audit.json
          python - <<'PY'
          import json
          sites = json.load(open('/tmp/mysql-sites.json'))['items']
          assert sum(item.get('code') == 'ci-mysql-site' for item in sites) == 1
          audits = json.load(open('/tmp/mysql-audit.json'))['items']
          assert any(item.get('recordId') and item.get('action') == 'INSERT' for item in audits)
          PY
      - name: Test MySQL constraints
        run: mysql -h 127.0.0.1 -uroot -proot chronofish < backend/db/tests/mysql/constraint_checks.sql
      - name: Verify MySQL master seed is idempotent
        run: |
          mysql -h 127.0.0.1 -uroot -proot chronofish < backend/db/seeds/mysql/master_data.sql
          mysql -h 127.0.0.1 -uroot -proot chronofish < backend/db/seeds/mysql/master_data.sql
