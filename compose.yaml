services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DB_DRIVER: postgres
      DATABASE_URL: postgresql+psycopg://chronofish:chronofish@postgres:5432/chronofish
      MIGRATIONS_DIR: /migrations/postgres
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "chronofish", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VCS_REF: ${VCS_REF:-unknown}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronofish
      POSTGRES_USER: chronofish
      POSTGRES_PASSWORD: chronofish
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronofish -d chronofish"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
