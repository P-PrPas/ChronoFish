services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      IP_ALLOWLIST: ${IP_ALLOWLIST:-}
      FORWARDED_ALLOW_IPS: "*"
      DB_DRIVER: postgres
      DATABASE_URL: postgresql+psycopg://chronofish:chronofish@postgres:5432/chronofish
      MIGRATIONS_DIR: /migrations/postgres
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "chronofish", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VCS_REF: ${VCS_REF:-unknown}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronofish
      POSTGRES_USER: chronofish
      POSTGRES_PASSWORD: chronofish
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronofish -d chronofish"]
      interval: 5s
      timeout: 3s
      retries: 10
  seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: chronofish
    volumes:
      - ./backend/db/seeds/postgres:/seeds:ro
    command:
      - sh
      - -c
      - psql -h postgres -U chronofish -d chronofish -v ON_ERROR_STOP=1 -f /seeds/master_data.sql -f /seeds/demo_data.sql
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
volumes:
  postgres-data:
