services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DB_DRIVER: postgres
      DATABASE_URL: postgres://chronofish:chronofish@postgres:5432/chronofish?sslmode=disable
      MIGRATIONS_DIR: /migrations/postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/chronofish", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronofish
      POSTGRES_USER: chronofish
      POSTGRES_PASSWORD: chronofish
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronofish -d chronofish"]
      interval: 5s
      timeout: 3s
      retries: 10
  mysql:
    image: mysql:8.0
    profiles: [mysql]
    environment:
      MYSQL_DATABASE: chronofish
      MYSQL_USER: chronofish
      MYSQL_PASSWORD: chronofish
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
  api-mysql:
    profiles: [mysql]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DB_DRIVER: mysql
      DATABASE_URL: chronofish:chronofish@tcp(mysql:3306)/chronofish?parseTime=true
      MIGRATIONS_DIR: /migrations/mysql
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  postgres-data:
  mysql-data:
